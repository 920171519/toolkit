name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deployment script
        run: bash tests/deploy-ubuntu.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm install --global --ignore-scripts pnpm@11.19.0
          pnpm install --frozen-lockfile

      # The hosted Ubuntu image already supplies the browser's system libraries.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Check lint and architecture
        run: pnpm lint

      - name: Build and run browser tests
        run: pnpm test:e2e:full

      - name: Check TypeScript
        run: pnpm typecheck
